<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Amazon Music">
  <defs>
    <linearGradient id="am-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19a7ff"/>
      <stop offset="0.52" stop-color="#6f4dff"/>
      <stop offset="1" stop-color="#d900ff"/>
    </linearGradient>
    <linearGradient id="am-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a4dff"/>
      <stop offset="1" stop-color="#9c4dff"/>
    </linearGradient>
    <linearGradient id="am-smile" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="0.55" stop-color="#d8b6ff"/>
      <stop offset="1" stop-color="#8ed8ff"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="18" fill="#05070a" stroke="url(#am-border)" stroke-width="7"/>

  <text x="64" y="67" text-anchor="middle" fill="url(#am-word)"
        font-family="Arial Rounded MT Bold, Arial, Helvetica, sans-serif"
        font-size="39" font-weight="700" letter-spacing="-2">music</text>

  <path d="M30 83 C47 95 76 98 97 85"
        fill="none" stroke="url(#am-smile)" stroke-width="6"
        stroke-linecap="round"/>
  <path d="M91 80 L101 83 L98 94"
        fill="none" stroke="#91dcff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
