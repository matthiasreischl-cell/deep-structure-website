<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#020407" />
  <meta name="description" content="Deep Structure — enter the world beneath the surface." />
  <title>Deep Structure</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="fluid" aria-hidden="true"></canvas>
  <div class="noise" aria-hidden="true"></div>

  <main class="landing" id="landing">
    <button class="logo-button" id="enterButton" type="button" aria-label="Enter Deep Structure">
      <span class="logo-aura" aria-hidden="true"></span>
      <img class="logo" src="assets/deep-structure-logo.webp" alt="Deep Structure" draggable="false" />
    </button>
  </main>

  <div class="transition" id="transition" aria-hidden="true">
    <div class="transition-ring" aria-hidden="true"></div>
    <p class="transition-copy">The World you get in.</p>
  </div>

  <div class="inside" id="inside" aria-hidden="true">
    <div class="inside-mark" aria-hidden="true"></div>
  </div>

  <div class="compass" id="compass" aria-hidden="true">
    <span class="compass-ring"></span>
    <span class="compass-needle"></span>
    <span class="compass-dot"></span>
  </div>

  <script src="app.js"></script>
</body>
</html>
