  <meta name="description" content="Deep Structure Internetradio — dunkle Geschichten und Drum & Bass. Entdecke veröffentlichte Vinyl, Apps und Spiele." />
  <title>Deep Structure — Internetradio, Vinyl, Apps &amp; Spiele, Webshop</title>

  <meta property="og:description" content="Dunkle Geschichten und Drum &amp; Bass. Radio hören, Vinyl entdecken, Apps und Spiele von Deep Structure." />

  <link rel="icon" href="./favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="fonts.css?v=1" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="pool-surface.css?v=2" />
  <link rel="stylesheet" href="world.css?v=1" />

  <link rel="stylesheet" href="channels.css?v=3" />

  <link rel="stylesheet" href="cursor.css?v=1" />

  <link rel="stylesheet" href="polish.css?v=4" />
  <link rel="stylesheet" href="speaker.css?v=3" />

  <link rel="stylesheet" href="shop.css?v=3" />
</head>
<body>
  <canvas id="fluid" aria-hidden="true"></canvas>
  <div class="depth-vignette" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <main class="landing" id="landing">
    <button class="logo-button" id="enterButton" type="button" aria-label="Enter Deep Structure">
      <span class="water-shadow" aria-hidden="true"></span>
      <span class="symbol-stage" id="symbolStage" aria-hidden="true"></span>
      <span class="symbol-reflection" aria-hidden="true"></span>
      <span class="wordmark">DEEP STRUCTURE</span>
    </button>
    <nav class="landing-legal" aria-label="Rechtliches"><a href="./impressum.html">Impressum</a><a href="./datenschutz.html">Datenschutz</a></nav>
  </main>

  <div class="transition" id="transition" aria-hidden="true">
    <div class="transition-ripple" aria-hidden="true"></div>
    <p class="transition-copy">The World you get in.</p>
  </div>

  <div class="inside" id="inside" aria-hidden="true" inert>
    <section class="world" id="world" aria-label="Deep Structure World" tabindex="-1">
      <div class="world-haze" aria-hidden="true"></div>
      <div class="world-scene" id="worldScene">
        <div class="world-core" aria-hidden="true"></div>
        <div id="worldObjects"></div>
      </div>

      <header class="world-header">
        <h1><a class="world-home" href="./" title="Zur Startseite mit dem Logo">DEEP STRUCTURE <span>INTERNETRADIO</span></a></h1>
        <nav class="world-index" id="worldIndex" aria-label="Bereiche"></nav>
      </header>
      <footer class="world-footer">
        <span>Dunkle Geschichten. Drum &amp; Bass. Eigene Welten.</span>
        <nav class="world-legal" aria-label="Rechtliches"><a href="./impressum.html">Impressum</a><a href="./datenschutz.html">Datenschutz</a></nav>
      </footer>

      <div class="world-panel" id="worldPanel" role="dialog" aria-modal="true" aria-label="Deep Structure – Bereich" aria-hidden="true">
        <div class="world-panel-card">
          <button class="world-panel-close" id="worldPanelClose" type="button" aria-label="Schließen"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg></button>
          <div id="worldPanelCard"></div>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    // Die Startseite kommt bei jedem neuen Besuch und bei jedem Neuladen zuerst. Direkt in
    // die Welt geht es nur, wenn man gerade erst drin war und von Impressum/Datenschutz zurückkommt.
    // Ohne das öffnete das Handy die gemerkte Adresse #inside und übersprang das Logo.
    const RECENT_MS = 30 * 60 * 1000;
    const readSeen = () => { try { return Number(localStorage.getItem('ds-inside-at')) || 0; } catch (e) { return 0; } };
    const markSeen = () => { try { localStorage.setItem('ds-inside-at', String(Date.now())); } catch (e) {} };
    // Neu laden (auch am Handy) beginnt immer beim Logo im Wasser.
    const navType = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0] || {}).type;
    if (location.hash === '#inside' && (navType === 'reload' || Date.now() - readSeen() > RECENT_MS)) {
      history.replaceState(null, '', location.pathname + location.search);
    }
    addEventListener('deepstructure:entered', markSeen);
    addEventListener('pagehide', () => { if (location.hash === '#inside') markSeen(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden && location.hash === '#inside') markSeen(); });
    if (location.hash === '#inside') markSeen();

    // 3D-Startseite (Logo schwimmt auf Wasser), wenn das Gerät WebGL2 kann; sonst die bisherige Variante.
    window.__DS_LANDING3D = location.hash !== '#inside' && (() => {
      try { const c = document.createElement('canvas'); const g = c.getContext('webgl2'); if (g) { const x = g.getExtension('WEBGL_lose_context'); if (x) x.loseContext(); return true; } } catch (e) {}
      return false;
    })();
    import('./music.js?v=4').catch(error => console.warn('Hintergrundmusik nicht verfügbar:', error));
    await import('./app.js?v=12');
    if (location.hash === '#inside') {
      document.body.classList.add('entered');
      document.getElementById('inside').setAttribute('aria-hidden', 'false');
      document.getElementById('inside').inert = false;
      document.getElementById('landing').inert = true;
    } else if (window.__DS_LANDING3D) {
      try {
        await import('./landing-3d.js?v=5');
      } catch (error) {
        console.warn('3D-Startseite nicht verfügbar, nutze Ersatz:', error);
        window.__DS_LANDING3D = false;
        document.body.classList.remove('scene3d');
        document.getElementById('scene3d')?.remove();
        window.__dsInitWater?.();
        await import('./symbol-v2.js?v=6');
      }
    } else {
      await import('./symbol-v2.js?v=6');
    }
    await import('./world.js?v=22');
    await import('./perception-game.js?v=3');
  </script>
</body>
</html>
