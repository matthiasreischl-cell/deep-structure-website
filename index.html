<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#010305" />
  <meta name="description" content="Deep Structure — enter the world beneath the surface." />
  <title>Deep Structure</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="world.css?v=1" />
  <link rel="stylesheet" href="radio.css?v=1" />
  <link rel="stylesheet" href="couch.css?v=2" />
  <link rel="stylesheet" href="channels.css?v=2" />
  <link rel="stylesheet" href="memories.css?v=1" />
  <link rel="stylesheet" href="world-i-let-in.css?v=1" />
</head>
<body>
  <canvas id="fluid" aria-hidden="true"></canvas>
  <div class="depth-vignette" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <main class="landing" id="landing">
    <button class="logo-button" id="enterButton" type="button" aria-label="Enter Deep Structure">
      <span class="water-shadow" aria-hidden="true"></span>
      <span class="symbol-stage" id="symbolStage" aria-hidden="true"></span>
      <span class="symbol-reflection" aria-hidden="true"></span>
      <span class="wordmark">DEEP STRUCTURE</span>
    </button>
  </main>

  <div class="transition" id="transition" aria-hidden="true">
    <div class="transition-ripple" aria-hidden="true"></div>
    <p class="transition-copy">The World you get in.</p>
  </div>

  <div class="inside" id="inside" aria-hidden="true">
    <section class="world" id="world" aria-label="Deep Structure World">
      <div class="world-haze" aria-hidden="true"></div>
      <div class="world-scene" id="worldScene">
        <div class="world-core" aria-hidden="true"></div>
        <div id="worldObjects"></div>
      </div>

      <button class="world-index-button" id="worldIndexButton" type="button" aria-label="Open navigation index">INDEX</button>
      <nav class="world-index" id="worldIndex" aria-label="World index"></nav>

      <div class="world-panel" id="worldPanel" aria-hidden="true">
        <div class="world-panel-card">
          <button class="world-panel-close" id="worldPanelClose" type="button" aria-label="Close">×</button>
          <div id="worldPanelCard"></div>
        </div>
      </div>
    </section>
  </div>

  <div class="compass" id="compass" aria-hidden="true">
    <span class="compass-ring"></span>
    <span class="compass-needle"></span>
    <span class="compass-dot"></span>
  </div>

  <script type="module">
    await import('./app.js?v=3');
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    await import('./symbol-v2.js?v=4');
    await import('./world.js?v=5');
  </script>
</body>
</html>
